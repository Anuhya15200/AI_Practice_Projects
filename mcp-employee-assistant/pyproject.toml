[project]
name = "mcp-employee-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anuhya", email = "anuhya15200@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-employee-assistant = "mcp_employee_assistant:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
